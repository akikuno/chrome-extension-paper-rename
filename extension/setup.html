<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>論文PDFの設定</title>
<link rel="stylesheet" href="setup.css">
</head>
<body>
<main>
  <h1>PDFのファイル名</h1>
  <form id="naming">
    <label for="template">命名書式</label>
    <input id="template" type="text" maxlength="512" spellcheck="false" required>
    <div id="fields" role="group" aria-label="挿入する項目"></div>

    <div class="space-setting">
      <label for="space">項目内の空白</label>
      <select id="space">
        <option value="_">_ に置換</option>
        <option value=" ">空白のまま</option>
        <option value="-">- に置換</option>
      </select>
    </div>

    <div class="preview-card">
      <strong id="preview-label">プレビュー</strong>
      <output id="preview" for="template space" aria-labelledby="preview-label"></output>
    </div>

    <div class="actions">
      <button id="reset" type="button">初期値に戻す</button>
      <button id="save" type="submit">保存</button>
    </div>
    <p id="naming-status" class="status" role="status"></p>
  </form>

  <section class="site-access" aria-labelledby="access-heading">
    <h2 id="access-heading">サイトへのアクセス</h2>
    <p id="status" class="status" role="status"></p>
    <button id="enable" type="button">サイトへのアクセスを許可</button>
  </section>
</main>
<script type="module" src="setup.js"></script>
</body>
</html>
